[project]
name = "lobbot"
version = "0.1.0"
description = "Compress a large LLM into a small task-specialised model you own."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# VM side ML deps are installed by scripts/setup_vm.sh into their own venvs.
api = ["fastapi", "uvicorn", "httpx"]
dev = ["pytest", "fastapi", "uvicorn", "httpx", "anthropic"]

[project.scripts]
lobbot = "lobbot.app:main"

[tool.setuptools.packages.find]
include = ["lobbot*", "common*", "stages*", "agent*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
