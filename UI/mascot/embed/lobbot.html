<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LOBBOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Caveat:wght@700&display=swap">
<style>
/* Layout: a blush page with one bordeaux stage where Dr. Lobbot acts out situations, above a monitor card (ECG + vitals + scene controls). Brand: bordeaux & rose, Manrope. Light by choice. */
:root {
  --page: #efe5e4;
  --card: #fcf3f2;
  --line: #e6d2d3;
  --plum: #4a2633;
  --muted: #74505c;
  --wine: #96445a;
  --wine-deep: #7a3247;
  --rose: #f4b8c4;
  --f-brand: "Manrope", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--page); color: var(--plum); font-family: var(--f-brand); font-size: 15px; }
.app { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 18px 28px; display: flex; flex-direction: column; gap: 14px; }

.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 16px; padding-inline: 4px; }
.word { font-weight: 800; font-size: 28px; letter-spacing: -0.02em; }
.sub { font-weight: 500; font-size: 14px; color: var(--muted); }

.scenes button, .auto {
  font: 600 13px var(--f-brand); color: var(--plum); background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; transition: border-color .15s, background .15s, color .15s, transform .1s;
}
button:hover { border-color: #cfaab3; }
button:active { transform: scale(0.97); }
button:focus-visible { outline: 2px solid var(--wine); outline-offset: 2px; }

.stage {
  position: relative; height: clamp(400px, 62vh, 700px); border-radius: 22px; overflow: hidden;
  background: radial-gradient(circle at 50% 44%, #ad5a70 0%, var(--wine) 42%, var(--wine-deep) 100%);
}
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; touch-action: none; }
.note { position: absolute; left: 22px; bottom: 18px; max-width: min(380px, calc(100% - 44px)); pointer-events: none; color: #fff; }
.note .k { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #fff; }
.note h2 { font-weight: 800; font-size: 22px; letter-spacing: -0.01em; margin: 4px 0 6px; text-wrap: balance; }
.note p { margin: 0; color: #fff; line-height: 1.45; font-size: 14px; }
.hint { position: absolute; right: 20px; top: 16px; font-size: 12px; font-weight: 600; color: #fff; pointer-events: none; }

.monitor { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: stretch; }
.ecg { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; min-height: 112px; display: grid; grid-template-columns: minmax(0,1fr) auto; }
.trace { position: relative; min-height: 112px; }
.trace canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.vitals { display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 12px 18px; border-left: 1px solid var(--line); min-width: 180px; }
.vitals div { display: flex; justify-content: space-between; gap: 14px; align-items: baseline; }
.vitals span { font-size: 12px; font-weight: 500; color: var(--muted); }
.vitals b { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
#vBpm, #vParams { color: var(--wine); }

.controls { display: flex; flex-direction: column; gap: 8px; justify-content: center; }
.scenes { display: grid; grid-template-columns: repeat(3, auto); gap: 6px; }
.scenes button kbd { font: 600 11px var(--f-brand); color: var(--muted); font-variant-numeric: tabular-nums; }
.scenes button[aria-pressed="true"] { background: var(--wine); border-color: var(--wine-deep); color: #fff; }
.scenes button[aria-pressed="true"] kbd { color: var(--rose); }
.auto { justify-content: center; }
.auto[aria-pressed="true"] { border-color: var(--wine); color: var(--wine); }

@media (max-width: 760px) {
  .monitor { grid-template-columns: minmax(0, 1fr); }
  .scenes { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .scenes button { justify-content: center; padding-inline: 8px; }
  .scenes button kbd { display: none; }
  .hint { display: none; }
  .note p { display: none; }
  .stage { height: clamp(360px, 58vh, 540px); }
}
</style>
<style>
html, body { height: 100%; margin: 0; background: transparent !important; overflow: hidden; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
.top, .note, .hint, .monitor { display: none !important; }
.app { max-width: none; padding: 0; height: 100%; gap: 0; }
.stage { height: 100% !important; border-radius: 0; background: transparent; }
</style>

</head><body>
<div class="app">
  <header class="top">
    <span class="word">lobbot</span>
    <span class="sub">Cut the model. Keep the capability.</span>
  </header>

  <main class="stage" id="stage">
    <canvas id="gl" aria-label="Dr. Lobbot in 3D. Click to tickle him."></canvas>
    <div class="note">
      <div class="k" id="nKey">Scene 1 / 9</div>
      <h2 id="nName">Idle</h2>
      <p id="nDesc"></p>
    </div>
    <div class="hint">click him · keys 1 to 9</div>
  </main>

  <section class="monitor">
    <div class="ecg">
      <div class="trace"><canvas id="ecg"></canvas></div>
      <div class="vitals">
        <div><span>Status</span><b id="vState">Idle</b></div>
        <div><span>BPM</span><b id="vBpm">72</b></div>
        <div><span>Model</span><b id="vParams">70B</b></div>
      </div>
    </div>
    <div class="controls">
      <div class="scenes" id="scenes"></div>
      <button class="auto" id="auto" aria-pressed="true">Auto demo</button>
    </div>
  </section>
</div>

<script>window.LOBBOT_EMBED = true;</script>
<script src="three.min.js"></script>
<script>
(() => {
THREE.ColorManagement.legacyMode = false;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOTION = RM ? 0.3 : 1;
// brand: bordeaux & rose. "scrub" is the light accent (rose), "ink" the dark one (plum)
const COL = { scrub: 0xf4b8c4, pulse: 0xff5a7a, white: 0xfcf3f2, ink: 0x4a2633, amber: 0xffc94a, wine: 0x96445a };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const damp = (c, t, k, dt) => c + (t - c) * (1 - Math.exp(-k * dt));
const seg = (s, a, b) => clamp((s - a) / (b - a), 0, 1);
const eio = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eob = x => x <= 0 ? 0 : 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2);
const ein = x => x * x * x;
const eout = x => 1 - Math.pow(1 - x, 3);
const TAU = Math.PI * 2;

/* ---------- renderer ---------- */
const stage = document.getElementById('stage');
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.setClearColor(0x000000, 0);
const world = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 60);
camera.position.set(0, 0.15, 6.6);

const pmrem = new THREE.PMREMGenerator(renderer);
const env = new THREE.Scene();
env.add(new THREE.Mesh(new THREE.BoxGeometry(10, 10, 10), new THREE.MeshBasicMaterial({ color: 0x5a2436, side: THREE.BackSide })));
const envPanel = (c, i, p, s) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(s[0], s[1]),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(i), side: THREE.DoubleSide }));
  m.position.set(...p); m.lookAt(0, 0, 0); env.add(m);
};
envPanel(0xffffff, 3, [0, 4, 2], [5, 2]);
envPanel(COL.scrub, 2.2, [-4.5, 0.5, -1], [2, 5]);
envPanel(COL.pulse, 2, [4.5, -0.5, -1], [2, 5]);
envPanel(0xffffff, 1.2, [0, 0, 4.8], [4, 3]);
world.environment = pmrem.fromScene(env, 0.03).texture;

world.add(new THREE.HemisphereLight(0xffe9ec, 0x4a2633, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 1.3); key.position.set(2.5, 3.5, 4); world.add(key);
const rimA = new THREE.DirectionalLight(0xffc7d3, 1.5); rimA.position.set(-4, 1.5, -3); world.add(rimA);
const rimB = new THREE.DirectionalLight(0xff8fa6, 1.0); rimB.position.set(4, -1, -3); world.add(rimB);

const BASE_Y = -0.35;
const set = new THREE.Group(); world.add(set);    // props that stay put (doors, sign, confetti)
const rig = new THREE.Group(); world.add(rig);    // follows Lobbot around (bubble, bulb, scalpel, jar)
const body = new THREE.Group(); rig.add(body);    // squash, turn, tilt
rig.position.y = BASE_Y;

/* ---------- small texture helpers ---------- */
const labels = [];
function label(text, o = {}) {
  const mat = new THREE.SpriteMaterial({ transparent: true, depthTest: false, depthWrite: false, toneMapped: false });
  const sp = new THREE.Sprite(mat); sp.renderOrder = 20;
  sp.userData = {
    h: o.h || 0.3, aspect: 1, text,
    redraw(txt) {
      if (txt !== undefined) sp.userData.text = txt;
      const R = 2, fs = (o.size || 72) * R, font = `${o.weight || 800} ${fs}px ${o.font || 'Manrope, "Helvetica Neue", sans-serif'}`;
      const cv = document.createElement('canvas'), ctx = cv.getContext('2d');
      ctx.font = font;
      const pad = (o.pad ?? 22) * R, w = Math.ceil(ctx.measureText(sp.userData.text).width) + pad * 2, h = Math.ceil(fs * 1.25) + pad * 2;
      cv.width = w; cv.height = h;
      ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (o.bg) { ctx.fillStyle = o.bg; ctx.beginPath(); ctx.roundRect(4 * R, 4 * R, w - 8 * R, h - 8 * R, (o.radius ?? 18) * R); ctx.fill(); }
      if (o.stroke) { ctx.lineWidth = (o.strokeW || 14) * R; ctx.strokeStyle = o.stroke; ctx.lineJoin = 'round'; ctx.strokeText(sp.userData.text, w / 2, h / 2 + fs * 0.05); }
      ctx.fillStyle = o.color || '#fff'; ctx.fillText(sp.userData.text, w / 2, h / 2 + fs * 0.05);
      const tex = new THREE.CanvasTexture(cv); tex.encoding = THREE.sRGBEncoding; tex.anisotropy = 8;
      if (mat.map) mat.map.dispose();
      mat.map = tex; mat.needsUpdate = true; sp.userData.aspect = w / h;
    }
  };
  sp.userData.redraw(); labels.push(sp);
  return sp;
}
const sizeSprite = (sp, k) => sp.scale.set(sp.userData.h * sp.userData.aspect * Math.max(k, 1e-4), sp.userData.h * Math.max(k, 1e-4), 1);
Promise.all([document.fonts.load('800 72px Manrope'), document.fonts.load('700 64px Manrope')])
  .then(() => labels.forEach(l => { const k = l.scale.y / l.userData.h; l.userData.redraw(); sizeSprite(l, k); })).catch(() => {});

function canvasTex(w, h, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'));
  const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; return t;
}
const dotTex = canvasTex(64, 64, g => {
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,255,255,0.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
});
const starTex = canvasTex(256, 256, g => {
  g.scale(2, 2);
  g.fillStyle = '#ffffff'; g.strokeStyle = '#4a2633'; g.lineWidth = 8; g.lineJoin = 'round';
  g.beginPath();
  for (let i = 0; i < 10; i++) { const r = i % 2 ? 22 : 54, a = -Math.PI / 2 + i * Math.PI / 5; g.lineTo(64 + Math.cos(a) * r, 64 + Math.sin(a) * r); }
  g.closePath(); g.stroke(); g.fill();
});
const glowSprite = (color, opacity = 0.8) => {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: dotTex, color, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity, toneMapped: false }));
  s.renderOrder = 15; return s;
};

/* ---------- the brain ---------- */
function smoothNormals(geo) {   // SphereGeometry duplicates seam vertices; average them so no crease shows
  geo.computeVertexNormals();
  const p = geo.attributes.position.array, n = geo.attributes.normal.array, groups = new Map();
  for (let i = 0; i < p.length / 3; i++) {
    const k = p[3 * i].toFixed(4) + ',' + p[3 * i + 1].toFixed(4) + ',' + p[3 * i + 2].toFixed(4);
    (groups.get(k) || groups.set(k, []).get(k)).push(i);
  }
  for (const ids of groups.values()) {
    if (ids.length < 2) continue;
    let x = 0, y = 0, z = 0;
    for (const i of ids) { x += n[3 * i]; y += n[3 * i + 1]; z += n[3 * i + 2]; }
    const l = Math.hypot(x, y, z) || 1;
    for (const i of ids) { n[3 * i] = x / l; n[3 * i + 1] = y / l; n[3 * i + 2] = z / l; }
  }
}
const brainGeo = new THREE.SphereGeometry(1, 180, 130);
const BA = brainGeo.attributes.position.array, BN = BA.length / 3;
const brainBase = Float32Array.from(BA), brainFold = new Float32Array(BN);
function foldAt(x, y, z) {
  const s = Math.sin(x * 7 + Math.sin(y * 6) * 1.4) + Math.sin(y * 8 + Math.sin(z * 5) * 1.6) + Math.sin(z * 7 + Math.sin(x * 6) * 1.3);
  let d = -0.07 * Math.exp(-s * s * 5);                                  // sulci
  d -= 0.2 * Math.exp(-x * x / 0.003) * clamp((y + 0.15) / 0.4, 0, 1);   // the two hemispheres
  if (y < -0.55) d -= (-0.55 - y) * 0.35;
  return d;
}
const wobbleAt = (x, y, z) => P.wobble * 0.05 * (Math.sin(x * 3 + t * P.speed * 1.7) + Math.sin(y * 4 + t * P.speed * 1.3) + Math.sin(z * 3.5 + t * P.speed * 2.1)) / 3;
for (let i = 0; i < BN; i++) {
  const x = BA[3 * i], y = BA[3 * i + 1], z = BA[3 * i + 2];
  const d = foldAt(x, y, z);
  brainFold[i] = d;
  BA[3 * i] = x * (1 + d); BA[3 * i + 1] = y * (1 + d); BA[3 * i + 2] = z * (1 + d);
}
smoothNormals(brainGeo);
const brainMat = new THREE.MeshPhysicalMaterial({
  color: 0xff8a9c, roughness: 0.42, clearcoat: 0.6, clearcoatRoughness: 0.3,
  sheen: 0.6, sheenRoughness: 0.5, sheenColor: new THREE.Color(0xffc2cf), emissive: COL.pulse, emissiveIntensity: 0.05
});
const brain = new THREE.Mesh(brainGeo, brainMat);
brain.scale.set(1.12, 0.92, 1);
body.add(brain);

const strapMat = new THREE.MeshStandardMaterial({ color: 0xf4f7ff, roughness: 0.55 });
const metalMat = new THREE.MeshStandardMaterial({ color: 0xe9eef8, metalness: 1, roughness: 0.14 });
const darkMetal = new THREE.MeshStandardMaterial({ color: 0x4a2633, metalness: 0.4, roughness: 0.4 });
const band = new THREE.Mesh(new THREE.TorusGeometry(0.93, 0.035, 12, 96), strapMat);
band.scale.set(1.12, 1, 1); band.rotation.x = Math.PI / 2 - 0.18; band.position.y = 0.36;
body.add(band);
const mirror = new THREE.Group();
{
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.27, 0.035, 48), metalMat); disc.rotation.x = Math.PI / 2; mirror.add(disc);
  mirror.add(new THREE.Mesh(new THREE.TorusGeometry(0.27, 0.03, 12, 48), darkMetal));
  const hole = new THREE.Mesh(new THREE.CircleGeometry(0.05, 24), new THREE.MeshBasicMaterial({ color: COL.ink })); hole.position.z = 0.02; mirror.add(hole);
}
mirror.position.set(-0.52, 0.66, 0.8); mirror.rotation.set(-0.45, -0.3, 0.15);
body.add(mirror);

/* ---------- face: glasses, brows, eyes, mouth drawn on a canvas ---------- */
const FACE_RES = 2;
const faceCv = document.createElement('canvas'); faceCv.width = 512 * FACE_RES; faceCv.height = 320 * FACE_RES;
const fctx = faceCv.getContext('2d');
const faceTex = new THREE.CanvasTexture(faceCv); faceTex.encoding = THREE.sRGBEncoding; faceTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const face = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 1.3 * 320 / 512),
  new THREE.MeshBasicMaterial({ map: faceTex, transparent: true, depthWrite: false, depthTest: false, toneMapped: false }));
face.renderOrder = 10; face.position.set(0, -0.1, 1.05);
body.add(face);

function drawFace(f) {
  const c = fctx, FR = '#f4f7ff', EYE = '#0a0f1f';
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, faceCv.width, faceCv.height);
  c.setTransform(FACE_RES, 0, 0, FACE_RES, 0, 0);
  c.lineCap = 'round'; c.lineJoin = 'round';
  const L = [176, 128], R = [336, 128], r = 68;
  c.fillStyle = 'rgba(255,255,255,0.22)';
  for (const [x, y] of [L, R]) { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
  c.strokeStyle = FR; c.lineWidth = 11;
  for (const [x, y] of [L, R]) { c.beginPath(); c.arc(x, y, r, 0, TAU); c.stroke(); }
  c.beginPath(); c.moveTo(L[0] + r - 2, 120); c.quadraticCurveTo(256, 100, R[0] - r + 2, 120); c.stroke();
  // brows
  c.lineWidth = 10;
  [L, R].forEach(([x], i) => {
    const sgn = i ? 1 : -1, base = 34 - f.brow * 16 - (i ? f.browOne * 14 : 0);
    const inX = x - sgn * 30, outX = x + sgn * 34;
    c.beginPath(); c.moveTo(outX, base - f.browTilt * 12); c.quadraticCurveTo(x, base - 8, inX, base + f.browTilt * 14); c.stroke();
  });
  // eyes
  c.fillStyle = EYE; c.strokeStyle = EYE; c.lineWidth = 12;
  [L, R].forEach(([x, y], i) => {
    const ex = x + clamp(f.gx + (i ? -f.cross : f.cross), -1.2, 1.2) * 22, ey = y - f.gy * 18;
    c.beginPath();
    switch (f.eyes) {
      case 'happy': c.moveTo(ex - 24, ey + 10); c.quadraticCurveTo(ex, ey - 28, ex + 24, ey + 10); c.stroke(); break;
      case 'closed': c.moveTo(ex - 24, ey); c.quadraticCurveTo(ex, ey + 20, ex + 24, ey); c.stroke(); break;
      case 'squeeze': { const d = i ? -1 : 1; c.moveTo(ex - 16 * d, ey - 20); c.lineTo(ex + 14 * d, ey); c.lineTo(ex - 16 * d, ey + 20); c.stroke(); break; }
      case 'spiral': {
        c.lineWidth = 7;
        for (let a = 0; a < 4.2 * Math.PI; a += 0.2) { const rr = 2 + a * 3.1, q = a + f.t * 7 * (i ? 1 : -1); c.lineTo(x + Math.cos(q) * rr, y + Math.sin(q) * rr); }
        c.stroke(); c.lineWidth = 12; break;
      }
      case 'big':
        c.arc(ex, ey, 27, 0, TAU); c.fill();
        c.fillStyle = '#fff'; c.beginPath(); c.arc(ex + 8, ey - 9, 8, 0, TAU); c.fill(); c.fillStyle = EYE; break;
      default: {
        const w = 30 * f.eyeScale, h = Math.max(6, 52 * f.eyeScale * f.open);
        c.roundRect(ex - w / 2, ey - h / 2, w, h, w / 2); c.fill();
        if (f.open > 0.5) { c.fillStyle = '#fff'; c.beginPath(); c.arc(ex + 5, ey - h * 0.22, 5.5, 0, TAU); c.fill(); c.fillStyle = EYE; }
      }
    }
  });
  // mouth
  const mx = 256, my = 262;
  c.beginPath();
  switch (f.masked ? 'none' : f.mouth) {
    case 'none': break;
    case 'talk': c.ellipse(mx, my, 20 + 8 * f.talk, 4 + 17 * f.talk, 0, 0, TAU); c.fill(); break;
    case 'happy': c.moveTo(mx - 42, my - 14); c.quadraticCurveTo(mx, my + 42, mx + 42, my - 14); c.closePath(); c.fill(); break;
    case 'O': c.ellipse(mx, my, 16, 21, 0, 0, TAU); c.fill(); break;
    case 'o': c.ellipse(mx, my, 7 + 4 * f.talk, 8 + 5 * f.talk, 0, 0, TAU); c.fill(); break;
    case 'tongue':   // concentrating while writing
      c.fillStyle = '#ff7d95'; c.ellipse(mx + 17, my + 8, 9, 12, -0.35, 0, TAU); c.fill(); c.fillStyle = EYE;
      c.beginPath(); c.lineWidth = 10; c.arc(mx, my - 22, 30, 0.22 * Math.PI, 0.78 * Math.PI); c.stroke(); break;
    case 'flat': c.lineWidth = 9; c.moveTo(mx - 22, my); c.lineTo(mx + 22, my); c.stroke(); break;
    case 'squiggle':
      c.lineWidth = 9; c.moveTo(mx - 28, my);
      for (let k = 1; k <= 4; k++) c.lineTo(mx - 28 + k * 14, my + (k % 2 ? 7 : -7));
      c.stroke(); break;
    case 'grr':
      c.lineWidth = 9; c.roundRect(mx - 30, my - 11, 60, 22, 8); c.stroke();
      c.moveTo(mx - 10, my - 11); c.lineTo(mx - 10, my + 11); c.moveTo(mx + 10, my - 11); c.lineTo(mx + 10, my + 11); c.stroke(); break;
    default: c.lineWidth = 10; c.arc(mx, my - 22, 30, 0.22 * Math.PI, 0.78 * Math.PI); c.stroke();
  }
  faceTex.needsUpdate = true;
}

/* ---------- props ---------- */
// surgical mask
const mask = new THREE.Group();
{
  const tex = canvasTex(256, 128, g => {
    g.fillStyle = '#a6dcec'; g.fillRect(0, 0, 256, 128);

// how far the writing has got at time tw: full lines before `line`, and `frac` of the current one
const WRITE_CPS = 22, LINE_PAUSE = 0.45;
function notesAt(tw) {
  let acc = 0;
  for (let i = 0; i < NOTES.length; i++) {
    const d = NOTES[i].length / WRITE_CPS;
    if (tw < acc + d) return { line: i, frac: Math.max(0, (tw - acc) / d), writing: tw >= acc };
    acc += d;
    if (tw < acc + LINE_PAUSE) return { line: i, frac: 1, writing: false };
    acc += LINE_PAUSE;
  }
  return { line: NOTES.length - 1, frac: 1, writing: false, done: true };
}
function drawNotes(w) {
  const c = nctx;
  c.fillStyle = '#fffaf8'; c.fillRect(0, 0, 600, 780);
  c.fillStyle = '#96445a'; c.font = '800 30px Manrope, sans-serif'; c.textBaseline = 'alphabetic';
  c.fillText('Dr. Lobbot · Consultation', LINE_X, 80);
  c.fillStyle = '#74505c'; c.font = '600 21px Manrope, sans-serif';
  c.fillText('Distillation ward · bed no. 3B', LINE_X, 112);
  c.strokeStyle = '#96445a'; c.lineWidth = 3; c.beginPath(); c.moveTo(LINE_X, 136); c.lineTo(600 - LINE_X, 136); c.stroke();
  c.strokeStyle = 'rgba(150,68,90,0.18)'; c.lineWidth = 2;
  for (let i = 0; i < 5; i++) { c.beginPath(); c.moveTo(LINE_X, LINE_Y(i) + 14); c.lineTo(600 - LINE_X, LINE_Y(i) + 14); c.stroke(); }
  c.fillStyle = '#2b1d5c'; let tipX = LINE_X;
  for (let i = 0; i <= w.line; i++) {
    let fs = 56; c.font = `700 ${fs}px Caveat, "Comic Sans MS", cursive`;
    const tw = c.measureText(NOTES[i]).width, maxW = 600 - LINE_X * 2;
    if (tw > maxW) { fs = Math.floor(fs * maxW / tw); c.font = `700 ${fs}px Caveat, "Comic Sans MS", cursive`; }
    const width = Math.min(tw, maxW), reveal = i < w.line ? 1 : w.frac;
    c.save(); c.beginPath(); c.rect(0, LINE_Y(i) - 60, LINE_X + width * reveal + 2, 90); c.clip();
    c.fillText(NOTES[i], LINE_X, LINE_Y(i)); c.restore();
    if (i === w.line) tipX = LINE_X + width * reveal;
  }
  notesTex.needsUpdate = true;
  return { x: tipX, y: LINE_Y(w.line) };
}

  dpr = Math.min(devicePixelRatio, 2);
  const ew = Math.max(1, Math.round(ecgCv.clientWidth * dpr)), eh = Math.max(1, Math.round(ecgCv.clientHeight * dpr));
  if (ew !== ecgCv.width || eh !== ecgCv.height) { ecgCv.width = ew; ecgCv.height = eh; trace = new Float32Array(ew); head = 0; }
}
new ResizeObserver(resize).observe(stage);
new ResizeObserver(resize).observe(ecgCv);
resize();

/* ---------- loop ---------- */
const P = { wobble: 0.35, speed: 0.8, glow: 0, eyeScale: 1, brow: 0, browTilt: 0, browOne: 0, cross: 0, beat: 0, kick: 0 };
const pose = {};
const gaze = { x: 0, y: 0 };
let t = 0, last = performance.now(), blinkStart = -1, nextBlink = 1.5, uiT = 0;
const vState = document.getElementById('vState'), vBpm = document.getElementById('vBpm'), vParams = document.getElementById('vParams');
play('idle');

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt; sceneT += dt;
  if (zooming) {
    camera.position.z = damp(camera.position.z, camZ, 5, dt);
    if (Math.abs(camera.position.z - camZ) < 0.01) zooming = false;
  }
  const sc = SCENES[current];
  // task + hold: keep him in surgery (noises repeat) until lobbot.finish()
  if (current === 'task' && hold && sceneT > 7.5) sceneT = 3.7;
  if (sceneT > sc.dur) {
    post({ event: 'ended', scene: current });
    if (loop) { sceneT = 0; fired = {}; glyphIdx = -1; }
    else if (auto) play(ORDER[(ORDER.indexOf(current) + 1) % ORDER.length]);
    else if (current !== 'idle') play('idle');
    else sceneT = 0;
  }

  Object.assign(pose, {
    x: 0, y: 0, sq: 0, sx: 0, tilt: 0, turn: 0, shake: 0, hidden: false, snapX: false,
    eyes: 'normal', mouth: 'smile', brow: 0, browTilt: 0, browOne: 0, eyeScale: 1, gaze: null, cross: 0, talk: 0, masked: false,
    wobble: 0.35, speed: 0.8, glow: 0, bpm: 72, ecg: 'normal', ecgColor: null, label: 'Idle', model: 70
  });
  for (const o of ALL_PROPS) o.visible = false;
  SCENES[current].run(sceneT, pose);

  pokeT = Math.max(0, pokeT - dt);
  if (pokeT > 0) { pose.eyes = 'happy'; pose.mouth = 'happy'; pose.brow = 0.5; }

  for (const k of ['wobble', 'speed', 'glow', 'eyeScale', 'brow', 'browTilt', 'browOne', 'cross']) P[k] = damp(P[k], pose[k], 8, dt);
  P.kick = damp(P.kick, 0, 7, dt);

  let gx, gy;
  if (pose.gaze) { gx = pose.gaze.x; gy = pose.gaze.y; }
  else if (t - pointer.last < 2.5) { gx = pointer.x; gy = pointer.y; }
  else { gx = Math.sin(t * 0.37) * 0.55; gy = Math.sin(t * 0.53) * 0.3; }
  gaze.x = damp(gaze.x, clamp(gx, -1, 1), 7, dt); gaze.y = damp(gaze.y, clamp(gy, -1, 1), 7, dt);

  if (t > nextBlink) { blinkStart = t; nextBlink = t + 2 + Math.random() * 3.5; }
  const open = t - blinkStart < 0.16 ? 1 - Math.sin(Math.PI * (t - blinkStart) / 0.16) : 1;

  ecgStep(dt, pose.bpm, pose.ecg === 'bug', pose.ecgColor || (pose.ecg === 'bug' ? '#d0304f' : '#96445a'));
  confettiStep(dt);

  // body
  const pop = eob(clamp(t / 0.6, 0, 1));
  const sq = (pose.sq + Math.sin(t * 1.6) * 0.015 + P.beat * 0.02 - P.kick * 0.18) * MOTION;
  const sx = 1 + pose.sx * MOTION, side = 1 / Math.sqrt(1 + sq);
  body.scale.set(side * sx * pop, (1 + sq) / Math.sqrt(sx) * pop, side * pop);
  body.visible = !pose.hidden;
  rig.position.x = pose.snapX ? pose.x : damp(rig.position.x, pose.x * (current === 'error' ? MOTION : 1), 8, dt);
  rig.position.y = damp(rig.position.y, BASE_Y + (pose.y + Math.sin(t * 1.1) * 0.04) * MOTION, 14, dt);
  body.position.x = pose.shake * MOTION;
  body.rotation.y = damp(body.rotation.y, gaze.x * 0.3 + pose.turn, 7, dt);
  body.rotation.x = damp(body.rotation.x, -gaze.y * 0.15, 6, dt);
  body.rotation.z = damp(body.rotation.z, pose.tilt * MOTION, 6, dt);

  // brain surface
  for (let i = 0; i < BN; i++) {
    const x = brainBase[3 * i], y = brainBase[3 * i + 1], z = brainBase[3 * i + 2];
    const k = 1 + brainFold[i] + wobbleAt(x, y, z);
    BA[3 * i] = x * k; BA[3 * i + 1] = y * k; BA[3 * i + 2] = z * k;
  }
  brainGeo.attributes.position.needsUpdate = true;
  brainMat.emissiveIntensity = 0.05 + P.glow * 0.35 + P.beat * 0.08;

  drawFace({
    eyes: pose.eyes, mouth: pose.mouth, masked: pose.masked, t,
    gx: gaze.x, gy: gaze.y, cross: P.cross, open: pose.eyes === 'normal' ? open : 1,
    eyeScale: P.eyeScale, brow: P.brow, browTilt: P.browTilt, browOne: P.browOne, talk: pose.talk
  });
  renderer.render(world, camera);

  uiT -= dt;
  if (uiT <= 0) {
    uiT = 0.1;
    vState.textContent = pokeT > 0 ? 'Tickled' : pose.label;
    vBpm.textContent = Math.round(bpm);
    vParams.textContent = (pose.model >= 10 ? pose.model.toFixed(0) : pose.model.toFixed(1)) + 'B';
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// hooks for the real agent: lobbot.play('think'), and #task style deep links
window.lobbot = {
  play: (id, opts) => SCENES[id] && play(id, true, opts),   // opts: { loop: true } repeats until the next play(); { hold: true } on 'task' waits in surgery
  finish: () => { hold = false; },                          // release a held 'task' so he comes back with the jar
  stop: () => play('idle', true),
  setFraming: f => { framing = f === 'close' ? 'close' : 'wide'; zooming = true; resize(); },
  seek: s => { sceneT = s; t = Math.max(t, 1); },
  scenes: ORDER
};
post({ event: 'ready' });
const fromHash = location.hash.slice(1);
if (SCENES[fromHash]) play(fromHash, true);
})();
</script>
