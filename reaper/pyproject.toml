[project]
name = "reaper-tui"
version = "0.2.0"
description = "REAPer: prune experts out of any MoE model with REAP, from a terminal UI on the GPU machine."
requires-python = ">=3.11"
dependencies = ["textual>=1.0", "huggingface_hub>=0.30"]

[project.scripts]
reaper = "reaper_tui.app:main"

[tool.setuptools.packages.find]
include = ["reaper_tui*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
