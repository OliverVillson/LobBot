[project]
name = "reaper-tui"
version = "0.1.0"
description = "REAPer: prune experts out of MoE models with REAP, from a terminal UI."
requires-python = ">=3.11"
dependencies = ["textual>=1.0"]

[project.scripts]
reaper = "reaper_tui.app:main"

[tool.setuptools.packages.find]
include = ["reaper_tui*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
